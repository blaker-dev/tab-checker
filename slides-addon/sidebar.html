<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        color: #202124;
      }
      .container { padding: 16px; }
      header h2 {
        margin: 0 0 4px 0;
        font-size: 16px;
        color: #1a73e8;
      }
      header p {
        margin: 0 0 16px 0;
        font-size: 12px;
        color: #5f6368;
      }
      .element-list {
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 0;
        margin: 0 0 16px 0;
        list-style-position: inside;
        max-height: 400px; /* Made slightly taller for the sidebar */
        overflow-y: auto;
      }
      .element-list li {
        padding: 10px 12px;
        border-bottom: 1px solid #f1f3f4;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer; /* Added pointer cursor */
        transition: background-color 0.2s;
      }
      .element-list li:hover {
        background-color: #f1f3f4; /* Hover effect for list items */
      }
      .element-list li:last-child { border-bottom: none; }
      .type-badge {
        display: inline-block;
        background: #e8f0fe;
        color: #1967d2;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-right: 8px;
      }
      .primary-btn {
        width: 100%;
        padding: 10px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .primary-btn:hover { background-color: #1557b0; }
      .status {
        margin-top: 8px;
        font-size: 12px;
        text-align: center;
        color: #d93025; 
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h2>Tab Order sequence</h2>
        <p>Current slide elements in navigation order. Click an item to select it on the slide.</p>
      </header>

      <ol id="tab-order-list" class="element-list"></ol>

      <div class="actions">
        <button id="scan-btn" class="primary-btn">Scan Current Slide</button>
        <div id="status-message" class="status"></div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const scanBtn = document.getElementById('scan-btn');
        const listContainer = document.getElementById('tab-order-list');
        const statusMsg = document.getElementById('status-message');

        scanBtn.addEventListener('click', () => {
          statusMsg.textContent = "Scanning slide...";
          statusMsg.style.color = "#5f6368";
          
          // Call the Apps Script backend function using google.script.run
          google.script.run
            .withSuccessHandler((elements) => {
               renderList(elements);
               statusMsg.textContent = "Scan complete!";
               statusMsg.style.color = "#1e8e3e"; 
            })
            .withFailureHandler((error) => {
               statusMsg.textContent = error.message;
               statusMsg.style.color = "#d93025"; 
            })
            .getSlideElements();
        });

        function renderList(elements) {
          listContainer.innerHTML = ''; 

          if (!elements || elements.length === 0) {
            listContainer.innerHTML = '<li style="color: #5f6368; text-align: center; cursor: default;">No elements found.</li>';
            return;
          }

          elements.forEach((el, index) => {
            const li = document.createElement('li');
            
            const numberSpan = document.createElement('strong');
            
            const badge = document.createElement('span');
            badge.className = 'type-badge';
            badge.textContent = el.type;

            const textSpan = document.createElement('span');
            textSpan.textContent = el.text;
            if (el.text.startsWith('Unnamed')) {
              textSpan.style.fontStyle = 'italic';
              textSpan.style.color = '#80868b';
            }

            li.appendChild(numberSpan);
            li.appendChild(badge);
            li.appendChild(textSpan);
            
            // Highlight element on click (server call)
            li.addEventListener('click', () => {
              google.script.run.highlightElementInSlide(el.id);
            });

            listContainer.appendChild(li);
          });
        }
      });
    </script>
  </body>
</html>

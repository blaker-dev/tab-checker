<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        color: #202124;
      }
      .container { padding: 16px; }
      header h2 {
        margin: 0 0 4px 0;
        font-size: 16px;
        color: #1a73e8;
      }
      header p {
        margin: 0 0 16px 0;
        font-size: 12px;
        color: #5f6368;
      }
      .element-list {
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 0;
        margin: 0 0 16px 0;
        list-style-position: inside;
        max-height: 400px; 
        overflow-y: auto;
      }
      .element-list li {
        padding: 10px 12px;
        border-bottom: 1px solid #f1f3f4;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: grab; /* Changed to grab for drag context */
        transition: background-color 0.2s, opacity 0.2s;
        display: flex; /* Align items nicely */
        align-items: center;
      }
      .element-list li:active {
        cursor: grabbing;
      }
      .element-list li:hover {
        background-color: #f1f3f4; 
      }
      .element-list li.dragging {
        opacity: 0.5;
        background-color: #e8eaed;
      }
      .element-list li:last-child { border-bottom: none; }
      
      .number-span {
        min-width: 24px; /* Keeps numbers aligned when hitting double digits */
        font-weight: bold;
      }
      
      .type-badge {
        display: inline-block;
        background: #e8f0fe;
        color: #1967d2;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-right: 8px;
      }
      .primary-btn {
        width: 100%;
        padding: 10px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .primary-btn:hover { background-color: #1557b0; }
      .status {
        margin-top: 8px;
        font-size: 12px;
        text-align: center;
        color: #d93025; 
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h2>Tab Order sequence</h2>
        <p>Drag and drop items to fix the screen reader order. Click an item to select it.</p>
      </header>

      <ol id="tab-order-list" class="element-list"></ol>

      <div class="actions">
        <button id="scan-btn" class="primary-btn">Refresh / Scan Slide</button>
        <div id="status-message" class="status"></div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const scanBtn = document.getElementById('scan-btn');
        const listContainer = document.getElementById('tab-order-list');
        const statusMsg = document.getElementById('status-message');

        // Initial scan on load
        triggerScan();

        scanBtn.addEventListener('click', triggerScan);

        function triggerScan() {
          statusMsg.textContent = "Scanning slide...";
          statusMsg.style.color = "#5f6368";
          
          google.script.run
            .withSuccessHandler((elements) => {
               renderList(elements);
               statusMsg.textContent = "Scan complete!";
               statusMsg.style.color = "#1e8e3e"; 
            })
            .withFailureHandler((error) => {
               statusMsg.textContent = error.message;
               statusMsg.style.color = "#d93025"; 
            })
            .getSlideElements();
        }

        function renderList(elements) {
          listContainer.innerHTML = ''; 

          if (!elements || elements.length === 0) {
            listContainer.innerHTML = '<li style="color: #5f6368; text-align: center; cursor: default;">No elements found.</li>';
            return;
          }

          elements.forEach((el, index) => {
            const li = document.createElement('li');
            li.draggable = true; // Make it draggable
            li.dataset.id = el.id; // Store the Google Slide Object ID
            
            const numberSpan = document.createElement('span');
            numberSpan.className = 'number-span';
            numberSpan.textContent = `${index + 1}. `;
            
            const badge = document.createElement('span');
            badge.className = 'type-badge';
            badge.textContent = el.type;

            const textSpan = document.createElement('span');
            textSpan.textContent = el.text;
            if (el.text.startsWith('Unnamed')) {
              textSpan.style.fontStyle = 'italic';
              textSpan.style.color = '#80868b';
            }

            li.appendChild(numberSpan);
            li.appendChild(badge);
            li.appendChild(textSpan);
            
            // Highlight element on click
            li.addEventListener('click', () => {
              google.script.run.highlightElementInSlide(el.id);
            });

            // --- DRAG AND DROP EVENTS ---
            li.addEventListener('dragstart', () => {
              li.classList.add('dragging');
            });

            li.addEventListener('dragend', () => {
              li.classList.remove('dragging');
              updateNumbersAndSave();
            });

            listContainer.appendChild(li);
          });
        }

        // Logic to visually reorder the list as you drag over it
        listContainer.addEventListener('dragover', e => {
          e.preventDefault(); // Required to allow dropping
          const afterElement = getDragAfterElement(listContainer, e.clientY);
          const draggable = document.querySelector('.dragging');
          if (afterElement == null) {
            listContainer.appendChild(draggable);
          } else {
            listContainer.insertBefore(draggable, afterElement);
          }
        });

        // Helper function to figure out exactly where the mouse is relative to other items
        function getDragAfterElement(container, y) {
          const draggableElements = [...container.querySelectorAll('li:not(.dragging)')];

          return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return { offset: offset, element: child };
            } else {
              return closest;
            }
          }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // Updates the visual numbers and sends the new order to the backend
        function updateNumbersAndSave() {
          statusMsg.textContent = "Saving new order...";
          statusMsg.style.color = "#1a73e8";

          const allItems = listContainer.querySelectorAll('li');
          const newOrderIds = [];

          allItems.forEach((li, index) => {
            const numberSpan = li.querySelector('.number-span');
            if (numberSpan) numberSpan.textContent = `${index + 1}. `;
            
            newOrderIds.push(li.dataset.id);
          });

          // send array of IDs in new order to backend
          google.script.run
            .withSuccessHandler(() => {
               statusMsg.textContent = "Order saved successfully!";
               statusMsg.style.color = "#1e8e3e"; 
            })
            .withFailureHandler((error) => {
               statusMsg.textContent = "Failed to save order: " + error.message;
               statusMsg.style.color = "#d93025"; 
            })
            .reorderSlideElements(newOrderIds);
        }
      });
    </script>
  </body>
</html>
